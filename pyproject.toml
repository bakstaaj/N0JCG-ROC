[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "n0jcg-roc"
version = "0.1.1"
description = "N0JCG Gateway radio operations center"
requires-python = ">=3.11"

[project.scripts]
n0jcg-roc = "n0jcg_roc.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
