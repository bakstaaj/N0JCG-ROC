# N0JCG Winlink/packet receive-only commissioning profile.
# This profile opens the DigiRig audio input but contains no PTT, beacon,
# digipeater, APRS-IS, AGW, or KISS listener configuration.

ADEVICE plughw:CARD=Device,DEV=0
ACHANNELS 1
ARATE 48000

CHANNEL 0
MYCALL N0JCG-10
MODEM 1200

AGWPORT 0
KISSPORT 0

# Keep transmit-capable directives out of this commissioning profile.
