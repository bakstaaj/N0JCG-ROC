# Disabled N0JCG Winlink RMS modem template.
# Do not copy this into /etc/n0jcg until authorization, frequency coordination,
# dummy-load testing, PTT verification, and the ROC transmit interlock pass.

ADEVICE plughw:CARD=Device,DEV=0
ACHANNELS 1
ARATE 48000

CHANNEL 0
MYCALL N0JCG-10
MODEM 1200

# The DigiRig CP2102N path is stable, but PTT remains deliberately disabled.
# PTT /dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_30217bb31dc6ef11ba3469527a5e3baa-if00-port0 RTS

TXDELAY 50
TXTAIL 5
SLOTTIME 10
PERSIST 63

AGWPORT 0
KISSPORT 0
KISSPORT 8010
