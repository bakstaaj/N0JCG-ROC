# N0JCG-ROC APRS receive-only contract.
# This file is an example only; the service is intentionally not enabled.
# The radio must be tuned to 144.390 MHz by a separate, documented receiver
# control step before Direwolf can decode packets.

MYCALL N0JCG-5
ADEVICE plughw:CARD=Device,DEV=0
CHANNEL 0
MODEM 1200
AGWPORT 8001
KISSPORT 8002

# No PTT, beacon, digipeat, APRS-IS, or transmit directives belong in this
# receive-only profile.
