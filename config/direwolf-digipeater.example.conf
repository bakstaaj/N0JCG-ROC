# N0JCG APRS digipeater commissioning profile.
# Disabled until the AnyTone/DigiRig audio and PTT path are identified.

MYCALL N0JCG-1
CHANNEL 0
MODEM 1200

# Replace these with the verified DigiRig capture/playback devices.
# ADEVICE plughw:<capture-card>,0 plughw:<playback-card>,0
# PTT GPIO <verified-ptt-device>

# Keep digipeating local and bounded during commissioning.
DIGIPEAT 0 1
AGWPORT 18010
KISSPORT 18011

# No APRS-IS uplink, beacon, or unattended transmit directive is enabled here.
